<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเรียนรู้คำศัพท์ภาษาอังกฤษ Pro</title>
    <!-- โหลดไลบรารี SheetJS สำหรับอ่านไฟล์ Excel (.xlsx, .xls) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Prompt, sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 680px;
            border: 1px solid var(--border-color);
        }

        h1 { text-align: center; font-size: 26px; margin: 0 0 6px 0; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin: 0 0 24px 0; }

        /* ส่วนอัปโหลดไฟล์ */
        .file-drop-area {
            border: 2px dashed #c7d2fe;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            background-color: #f5f3ff;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 16px;
        }
        .file-drop-area:hover { border-color: var(--primary); background-color: #eee0ff; }
        .file-drop-icon { font-size: 32px; margin-bottom: 8px; }
        .file-drop-text { color: var(--primary); font-size: 14px; font-weight: 500; }

        .divider {
            text-align: center; margin: 18px 0; color: var(--text-muted); font-size: 13px; position: relative;
        }
        .divider::before, .divider::after {
            content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background-color: var(--border-color);
        }
        .divider::before { left: 0; } .divider::after { right: 0; }

        textarea {
            width: 100%; height: 90px; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        textarea:focus { border-color: var(--primary); }

        .section-title { font-size: 14px; font-weight: 600; margin: 18px 0 8px 0; }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background-color: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .options-grid label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .btn-primary {
            width: 100%; padding: 14px; background-color: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 20px; transition: 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: #64748b; color: white; border: none; border-radius: 10px;
            padding: 10px 20px; font-size: 14px; cursor: pointer; margin-top: 18px; width: 100%;
        }

        .btn-history {
            background-color: #f1f5f9; color: #334155; border: 1px solid var(--border-color);
            border-radius: 10px;ยินดีช่วยครับ! แต่ดูเหมือนคุณยังไม่ได้แนบ **โค้ดต้นฉบับ** มาให้

รบกวนคัดลอกและวางโค้ดของคุณ (HTML, JavaScript, CSS ฯลฯ) ลงมาในแชทนี้ได้เลยครับ เมื่อผมเห็นโค้ดแล้ว จะดำเนินการปรับปรุงให้ตามที่คุณต้องการทั้งหมด:

*   ตรวจสอบบั๊กและปรับโครงสร้างโค้ดให้ทำงานได้เสถียรขึ้น
*   เพิ่มระบบบันทึกคะแนนและปุ่มนำเข้าข้อมูลจากไฟล์ Excel/CSV
*   ออกแบบหน้าตา UI ใหม่ให้สวยงามและดูทันสมัย
*   แก้ไขปัญหาการแสดงผลหรือการพิมพ์ภาษาไทยให้ถูกต้อง
*   เขียนโค้ดและรวบรวมเป็นไฟล์ HTML ฉบับสมบูรณ์ให้คุณนำไปใช้งานต่อได้ทันที

ส่งโค้ดของคุณมาได้เลยครับ!
